<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>No connection · Bar &amp; Restaurant</title>
    <style>
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #f2f4f3; color: #1b2320;
             font-family: system-ui, sans-serif; padding: 16px; }
      main { max-width: 22rem; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 16px; }
      h1 { font-size: 1.25rem; margin: 16px 0 8px; }
      p { color: #5b6662; line-height: 1.5; margin: 0 0 20px; }
      button { background: #c8891e; color: #0f211c; border: 0; border-radius: 10px; padding: 12px 20px;
               font-weight: 600; font-size: 1rem; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>No connection</h1>
      <p>This device can't reach the server. Check the Wi-Fi or internet, then try again. Nothing you entered before is lost: it's saved on the server.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
